name: docker-prod
on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
permissions: read-all

jobs:
  evaluate-jobs:
    name: Determine jobs execution
    runs-on: ubuntu-latest
    outputs:
      run-merge-build: ${{ steps.determine.outputs.run-merge-build }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Read VERSION file
        id: version
        # Strip the "+<digits>" build suffix, keep any following suffix (e.g. -rev1)
        run: echo "version=$(tr -d '\n' < VERSION | sed -E 's/\+[0-9]+//')" >> $GITHUB_OUTPUT

      - name: Determine jobs execution
        id: determine
        uses: unil-lettres/actions/job-execution@main
        with:
          version: ${{ steps.version.outputs.version }}
          image_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  build:
    name: Build
    if: needs.evaluate-jobs.outputs.run-merge-build == 'true'
    runs-on: ${{ matrix.os }}
    needs: [evaluate-jobs]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux/amd64
          - os: ubuntu-26.04-arm
            arch: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Build image
        uses: unil-lettres/actions/docker-build@main
        with:
          dockerfile: ./Dockerfile
          platform: ${{ matrix.arch }}
          image_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          name_prefix: app
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  merge:
    name: Merge
    if: needs.evaluate-jobs.outputs.run-merge-build == 'true'
    runs-on: ubuntu-latest
    needs: [evaluate-jobs, build]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Merge digests
        uses: unil-lettres/actions/docker-merge@main
        with:
          image_repository: ${{ vars.DOCKERHUB_REPOSITORY }}
          tag: ${{ github.ref_type == 'tag' && format('v{0}', needs.evaluate-jobs.outputs.version) || 'latest' }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  update-description:
    name: Update Description
    runs-on: ubuntu-latest
    needs: [merge]
    if: success()
    continue-on-error: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_REPOSITORY }}
