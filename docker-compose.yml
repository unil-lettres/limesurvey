version: "3.0"
services:
  lime-app:
    image: acspri/limesurvey:5.2.12
    volumes:
      - ./upload:/var/www/html/upload
      - ./plugins:/var/www/html/plugins
      - ./config:/var/www/html/application/config
    ports:
      - "127.0.0.1:8087:80"
    depends_on:
      - lime-db
    environment:
      - LIMESURVEY_DB_HOST=lime-db
    env_file:
      - ./.env
    container_name: lime-app
    restart: always
  lime-db:
    image: mariadb:10.6
    volumes:
      - db-data:/var/lib/mysql
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:3302:3306"
    container_name: lime-db
    restart: always

volumes:
  db-data:
